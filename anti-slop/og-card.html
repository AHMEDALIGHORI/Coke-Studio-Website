<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;0,6..96,900;1,6..96,700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #08070a;
      font-family: "Archivo", Arial, sans-serif;
      color: #f4efe6;
      position: relative;
      display: flex;
    }
    /* ambient stage glow */
    .glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(60% 80% at 18% 30%, rgba(232,33,42,0.20), transparent 60%),
        radial-gradient(50% 70% at 8% 90%, rgba(200,162,74,0.12), transparent 60%);
    }
    /* gold hairline frame */
    .frame {
      position: absolute; inset: 26px;
      border: 1px solid rgba(200,162,74,0.35);
      border-radius: 6px;
      pointer-events: none;
    }
    .left {
      position: relative;
      width: 760px; height: 100%;
      padding: 84px 60px 70px 72px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .eyebrow {
      font-size: 15px; letter-spacing: 0.42em; text-transform: uppercase;
      color: #c8a24a; font-weight: 500; margin-bottom: 30px;
    }
    .wordmark {
      font-family: "Bodoni Moda", serif; font-weight: 900;
      font-size: 96px; line-height: 0.9; letter-spacing: -0.02em; color: #f4efe6;
    }
    .wordmark .pk { display: block; color: #e8212a; font-style: italic; font-weight: 700; }
    .tagline {
      margin-top: 30px; font-size: 23px; font-weight: 300; color: #b9b3aa; max-width: 30ch; line-height: 1.4;
    }
    .stats {
      margin-top: 42px; display: flex; gap: 34px; align-items: baseline;
    }
    .stat b { font-family: "Bodoni Moda", serif; font-size: 40px; color: #e8212a; font-weight: 700; }
    .stat span { font-size: 14px; color: #9a958c; letter-spacing: 0.04em; }
    .stat { display: flex; flex-direction: column; gap: 4px; }
    .rule { width: 54px; height: 1px; background: rgba(200,162,74,0.5); margin-top: 40px; }
    .right {
      position: relative; width: 440px; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .art {
      width: 330px; height: 460px; border-radius: 4px; overflow: hidden;
      border: 1px solid rgba(200,162,74,0.45);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      background: #000;
    }
    .art img { width: 100%; height: 100%; object-fit: cover; object-position: center 42%; display: block; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="left">
    <div class="eyebrow">A tribute · since 2008</div>
    <div class="wordmark">Coke Studio<span class="pk">Pakistan</span></div>
    <p class="tagline">The sound of a nation. Fifteen seasons, one stage, and the anthems that crossed a billion plays.</p>
    <div class="stats">
      <div class="stat"><b>1.01B</b><span>most-viewed song</span></div>
      <div class="stat"><b>15</b><span>seasons</span></div>
      <div class="stat"><b>17.8M</b><span>subscribers</span></div>
    </div>
    <div class="rule"></div>
  </div>
  <div class="right">
    <div class="art">
      <img src="../assets/img/0a27910c38e1ce7bb9b53e69fb26eef0.jpg" alt="Coke Studio Pakistan" />
    </div>
  </div>
</body>
</html>
