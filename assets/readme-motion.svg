<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Coke Studio Pakistan tribute</title>
  <desc id="desc">Animated studio light, waveform and title card.</desc>
  <defs>
    <radialGradient id="light" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#f4efe6" stop-opacity=".28"/>
      <stop offset=".35" stop-color="#c8a24a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#08070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop stop-color="#e8212a"/>
      <stop offset="1" stop-color="#c8a24a"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="520" fill="#08070a"/>
  <circle cx="600" cy="215" r="260" fill="url(#light)" filter="url(#soft)">
    <animate attributeName="r" values="220;285;220" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#c8a24a" stroke-opacity=".42">
    <ellipse cx="600" cy="230" rx="170" ry="54">
      <animate attributeName="rx" values="170;320;170" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="230" rx="250" ry="78">
      <animate attributeName="rx" values="250;390;250" dur="5s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0;.5" dur="5s" begin="1.1s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g fill="#e0c27e">
    <circle cx="410" cy="280" r="3"><animate attributeName="cy" values="280;245;280" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="270" r="3"><animate attributeName="cy" values="270;305;270" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="330" r="2"><animate attributeName="cy" values="330;300;330" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="325" r="2"><animate attributeName="cy" values="325;350;325" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M160 418H1040" stroke="url(#rule)" stroke-width="2">
    <animate attributeName="d" values="M160 418H1040;M260 418H940;M160 418H1040" dur="5s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="130" fill="#e0c27e" text-anchor="middle" font-family="Georgia,serif" font-size="18" letter-spacing="8">A TRIBUTE TO THE SOUND OF A NATION</text>
  <text x="600" y="225" fill="#f4efe6" text-anchor="middle" font-family="Georgia,serif" font-size="76" font-weight="700">Coke Studio</text>
  <text x="600" y="298" fill="#e8212a" text-anchor="middle" font-family="Georgia,serif" font-size="66" font-style="italic">Pakistan</text>
  <text x="600" y="468" fill="#8a857e" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="4">SCROLL THE FILM  /  FIND THE ANTHEMS  /  HEAR THE ROOM</text>
</svg>
